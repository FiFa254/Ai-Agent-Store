services:
  - type: web
    name: grocerai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: MSSQL_CONNECTION_STRING
        sync: false
      - key: GEMINI_API_KEY
        sync: false
